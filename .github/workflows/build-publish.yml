name: Build and Publish DeskPet

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK and capture log
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "$code" > build.exit
          exit 0

      - name: Prepare output
        shell: bash
        run: |
          mkdir -p dist
          cp build.log dist/build.log
          code=$(cat build.exit)
          echo "build_exit_code=$code" > dist/status.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/DeskPet-debug.apk
            echo "apk_ready=true" >> dist/status.txt
          else
            echo "apk_ready=false" >> dist/status.txt
          fi

      - name: Commit build output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish DeskPet build output"
          git push origin HEAD:main
